[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launchcrush-presence-agent"
version = "0.1.0"
description = "Local camera presence and owner face verification runtime"
requires-python = ">=3.10"
dependencies = [
  "aiohttp==3.13.2",
  "mediapipe==0.10.35",
  "numpy==1.26.4",
  "opencv-contrib-python==4.11.0.86",
]

[tool.setuptools]
packages = ["presence_agent"]
